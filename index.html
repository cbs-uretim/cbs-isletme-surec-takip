<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CBS İşletme Süreç Takip</title><link rel="stylesheet" href="style.css"></head><body><header><div class="brand"><span class="mark">CBS</span><div><strong>CBS İşletme Süreç Takip Sistemi</strong><small>Çukurova Bombe Sanayi</small></div></div><div id="identity"></div></header><main><section id="login" class="panel login"><h1>Giriş Yap</h1><p>Yalnızca onaylanmış çalışanlar işletme verilerine erişebilir.</p><form id="loginForm"><label>E-posta<input id="email" type="email" required autocomplete="username"></label><label>Şifre<input id="password" type="password" required autocomplete="current-password"></label><button>Giriş Yap</button></form><p id="loginMessage" class="message"></p></section><section id="app" hidden><div class="heading"><div><h1>Genel İşletme Panosu</h1><p id="hello"></p></div><button id="refresh" class="secondary">Yenile</button></div><div class="stats" id="stats"></div><div class="toolbar"><input id="search" placeholder="Sipariş kodu veya müşteri ara"><select id="statusFilter"><option value="all">Tüm siparişler</option><option value="acik">Açık siparişler</option><option value="uretim">Üretimde</option><option value="sevkiyat">Sevkiyat bekleyen</option><option value="kapali">Kapanan siparişler</option></select><button id="newOrder" hidden>+ Yeni Sipariş</button></div><div class="panel scroll"><table><thead><tr><th>Sipariş</th><th>Müşteri</th><th>Ürün</th><th>Durum</th><th>Oluşturma</th><th></th></tr></thead><tbody id="ordersBody"></tbody></table></div><p id="appMessage" class="message"></p><section id="adminPanel" class="panel" hidden><h2>Kullanıcı Yönetimi</h2><p>Onay ve departman yetkilerini yalnızca yönetici değiştirebilir.</p><div id="users"></div></section></section></main><dialog id="detail"><div class="modalHead"><h2 id="detailTitle">Sipariş</h2><button class="secondary" data-close>Kapat</button></div><div class="tabs"><button id="tabProducts" class="selected">Ürünler</button><button id="tabHistory" class="secondary">İşlem Geçmişi</button></div><div id="productsView" class="scroll"></div><div id="historyView" hidden></div><p id="detailMessage" class="message"></p></dialog><dialog id="createDialog"><div class="modalHead"><h2>Yeni Sipariş</h2><button class="secondary" data-close>Kapat</button></div><form id="orderForm"><label>Sipariş kodu<input id="orderCode" required placeholder="CBS952"></label><label>Müşteri<input id="customer" required></label><div id="itemInputs"></div><button type="button" id="addItem" class="secondary">+ Ürün ekle</button><button type="submit">Siparişi Kaydet</button></form><p id="createMessage" class="message"></p></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="app.js"></script></body></html>
